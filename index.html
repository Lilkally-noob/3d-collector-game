<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>collector-game</title>
</head>

<body>
  <div id="flash"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="hud" class="hidden">
    <div>Score: <span id="score">0</span></div>
    <div class="coinRow">Coins: <span id="coins">0</span></div>
    <div>Time: <span id="timer">30</span></div>
    <div>Best: <span id="best">0</span></div>
  </div>

  <!-- Training start / game over screen -->
  <div id="overlay" class="hidden">
    <h1 id="overlayTitle">Training</h1>
    <p id="overlayText"></p>
    <div id="durationPicker">
      <button class="durBtn" data-seconds="15">15s</button>
      <button class="durBtn" data-seconds="30">30s</button>
      <button class="durBtn" data-seconds="60">60s</button>
    </div>
    <p id="bestText"></p>
    <button id="startBtn">Press to start</button>
    <button class="linkBtn backBtn">← Back to menu</button>
  </div>

  <!-- Mode select -->
  <div id="dashOverlay" class="hidden">
    <h1 id="dashTitle">Endless Dash</h1>
    <p id="dashText"></p>
    <p id="dashBestText"></p>
    <button id="dashStartBtn">Press to start</button>
    <button class="linkBtn backBtn">← Back to menu</button>
  </div>
  <button id="quitBtn" class="hidden">Quit run</button>

  <div id="modeMenu">
    <h1>Collector</h1>
    <p>Pick a mode</p>
    <button class="modeBtn" data-mode="training">
      Training
      <small>Timed rounds · avoid the red gems</small>
    </button>
    <button class="modeBtn" data-mode="dash">
      Endless Dash
      <small>Non-stop run · steer left and right</small>
    </button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
