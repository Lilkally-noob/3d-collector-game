<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>collector-game</title>
</head>

<body>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Time: <span id="timer">30</span></div>
  </div>

  <div id="flash"></div>
  <div id="joystick">
    <div id="stick"></div>
  </div>

  <div id="overlay">
    <h1 id="overlayTitle">Collector</h1>
    <p id="overlayText">WASD or arrows to move. Grab the cyan gems, avoid the red ones (-5).</p>
    <button id="startBtn">Press to start</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
